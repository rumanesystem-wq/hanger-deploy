<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>정산 — 발주허브</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.0/css/all.min.css"/>
<link rel="stylesheet" href="./style.css"/>
<style>
  body { background: var(--bg); padding: 24px; max-width: 1280px; margin: 0 auto; }
  .page-header { margin-bottom: 20px; }
  .page-title { font-size: 22px; font-weight: 800; color: var(--text); margin-bottom: 4px; }
  .page-sub { font-size: 13px; color: var(--text-3); }

  .nav-btns { display: flex; gap: 8px; margin-bottom: 20px; }
  .nav-btn { padding: 8px 16px; background: #fff; border: 1px solid var(--border); border-radius: var(--r-sm); font-size: 13px; font-weight: 600; color: var(--text-2); text-decoration: none; }
  .nav-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

  .filter-card { background: #fff; border: 1px solid var(--border); border-radius: var(--r); padding: 14px 18px; margin-bottom: 16px; }
  .filter-row { display: flex; flex-wrap: wrap; gap: 14px; align-items: end; }
  .filter-label { font-size: 11px; font-weight: 700; color: var(--text-2); margin-bottom: 4px; }
  .filter-card input, .filter-card select { padding: 7px 10px; border: 1px solid var(--border); border-radius: var(--r-sm); font-size: 13px; }
  .filter-card .spacer { flex: 1; }

  .period-tabs { display: flex; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; }
  .period-tab { padding: 7px 14px; background: #fff; border: 1px solid var(--border); border-radius: var(--r-sm); font-size: 12px; font-weight: 600; color: var(--text-2); cursor: pointer; }
  .period-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }

  .summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
  .summary-card { background: #fff; border: 1px solid var(--border); border-radius: var(--r); padding: 16px 20px; }
  .summary-label { font-size: 11px; color: var(--text-3); font-weight: 600; margin-bottom: 4px; }
  .summary-value { font-size: 20px; font-weight: 800; color: var(--text); }

  .data-card { background: #fff; border: 1px solid var(--border); border-radius: var(--r); padding: 16px 18px; margin-bottom: 16px; }
  .data-card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .data-card-title { font-size: 14px; font-weight: 700; color: var(--text); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { background: #f9fafb; padding: 10px 12px; text-align: left; border-bottom: 2px solid var(--border); font-size: 12px; font-weight: 700; color: var(--text-2); }
  td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.center, th.center { text-align: center; }
  tr.row-main { cursor: pointer; }
  tr.row-main:hover { background: #f0f9ff; }
  tr.row-total td { background: #eff6ff; font-weight: 700; }
  tr.row-detail.hidden { display: none; }
  tr.row-detail td { background: #fafafa; padding: 0; }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .badge-wh-siheung { background: #dbeafe; color: #1e40af; }
  .badge-wh-pyeongtaek { background: #fef3c7; color: #92400e; }

  .btn-edit { background: #f3f4f6; color: var(--text-2); border: none; padding: 4px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; }
  .btn-edit:hover { background: #e5e7eb; }
  .btn-link { background: #fff; color: var(--primary); border: 1px solid var(--primary); padding: 4px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; }
  .btn-link:hover { background: #eff6ff; }
  .btn-search { background: var(--primary); color: #fff; border: none; padding: 9px 20px; border-radius: var(--r-sm); font-size: 13px; font-weight: 700; cursor: pointer; }
  .btn-export { background: #15803d; color: #fff; border: none; padding: 9px 16px; border-radius: var(--r-sm); font-size: 13px; font-weight: 700; cursor: pointer; }

  .inline-edit { padding: 12px 16px; background: #fffbeb; }
  .inline-edit-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .inline-edit label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; font-weight: 700; color: var(--text-2); }
  .inline-edit input, .inline-edit select { padding: 6px 10px; border: 1px solid var(--border); border-radius: 4px; font-size: 13px; }
  .inline-edit-actions { display: flex; gap: 6px; }
  .btn-save { background: #15803d; color: #fff; border: none; padding: 6px 14px; border-radius: 4px; font-size: 12px; font-weight: 700; cursor: pointer; }
  .btn-cancel { background: #fff; color: var(--text-2); border: 1px solid var(--border); padding: 6px 14px; border-radius: 4px; font-size: 12px; cursor: pointer; }

  .hidden { display: none !important; }

  @media (max-width: 900px) {
    .summary-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<div class="page-header">
  <div class="page-title">정산</div>
  <div class="page-sub">기간별 출고 집계 + 납품처별 정산 (관리자 전용)</div>
</div>

<div class="nav-btns">
  <a href="./index.html" class="nav-btn"><i class="fas fa-arrow-left"></i> 발주앱</a>
  <a href="./settlement.html" class="nav-btn active"><i class="fas fa-receipt"></i> 정산</a>
  <a href="./customer-ledger.html" class="nav-btn"><i class="fas fa-book"></i> 거래처 원장</a>
  <a href="./index.html#orders" class="nav-btn"><i class="fas fa-file-invoice"></i> 거래명세서</a>
</div>

<!-- 기간 모드 탭 -->
<div class="period-tabs">
  <button class="period-tab" data-mode="daily">일별</button>
  <button class="period-tab" data-mode="weekly">주별</button>
  <button class="period-tab active" data-mode="monthly">월별</button>
  <button class="period-tab" data-mode="quarterly">분기</button>
  <button class="period-tab" data-mode="yearly">연도</button>
  <button class="period-tab" data-mode="custom">사용자 지정</button>
</div>

<!-- 필터 -->
<div class="filter-card">
  <div class="filter-row">
    <div class="fld" id="date-picker-wrap">
      <!-- updateDatePicker()가 렌더 -->
    </div>
    <div class="fld">
      <div class="filter-label">납품처 검색</div>
      <input type="text" id="filter-orderer" placeholder="납품처명 (Enter)" style="width:180px"/>
    </div>
    <div class="fld">
      <div class="filter-label">창고</div>
      <select id="filter-warehouse" style="width:120px">
        <option value="">전체</option>
        <option value="시흥">시흥</option>
        <option value="평택">평택</option>
      </select>
    </div>
    <button class="btn-search" onclick="loadData()"><i class="fas fa-search"></i> 조회</button>
    <div class="spacer"></div>
    <button class="btn-export" onclick="exportExcel()"><i class="fas fa-file-excel"></i> 엑셀 내보내기</button>
  </div>
</div>

<!-- 요약 카드 -->
<div class="summary-grid">
  <div class="summary-card">
    <div class="summary-label">출고 건수</div>
    <div class="summary-value" id="sum-count">0건</div>
  </div>
  <div class="summary-card">
    <div class="summary-label">공급가액</div>
    <div class="summary-value" id="sum-supply">₩0</div>
  </div>
  <div class="summary-card">
    <div class="summary-label">부가세</div>
    <div class="summary-value" id="sum-vat">₩0</div>
  </div>
  <div class="summary-card">
    <div class="summary-label" style="color:#1e40af">합계</div>
    <div class="summary-value" id="sum-total" style="color:#1e40af">₩0</div>
  </div>
</div>

<!-- 납품처별 표 -->
<div class="data-card">
  <div class="data-card-head">
    <div class="data-card-title">납품처별 정산 내역</div>
  </div>
  <div style="overflow-x:auto">
    <table>
      <thead>
        <tr>
          <th>납품처</th>
          <th class="num">건수</th>
          <th class="num">공급가액</th>
          <th class="num">부가세</th>
          <th class="num">합계</th>
          <th class="center">상세</th>
        </tr>
      </thead>
      <tbody id="tbody-ordererwise">
        <!-- JS로 채움 -->
      </tbody>
    </table>
  </div>
</div>

<!-- 추이 표 (월별=일별 추이, 분기/연도=월별 추이) -->
<div class="data-card" id="trend-card">
  <div class="data-card-head">
    <div class="data-card-title" id="trend-title">일별 추이</div>
  </div>
  <div style="overflow-x:auto">
    <table>
      <thead>
        <tr>
          <th>날짜</th>
          <th class="num">건수</th>
          <th class="num">합계</th>
        </tr>
      </thead>
      <tbody id="tbody-trend">
        <!-- JS로 채움 -->
      </tbody>
    </table>
  </div>
</div>

<!-- 정산 모듈 -->
<script src="./js/shared/format.js"></script>
<script src="./js/features/settlement/types.js"></script>
<script src="./js/features/settlement/utils.js"></script>
<script src="./js/features/settlement/validate.js"></script>
<script src="./js/features/settlement/query.js"></script>
<script src="./js/features/settlement/render.js"></script>
<script src="./js/features/settlement/export.js"></script>

<!-- SheetJS (엑셀 내보내기용) -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<!-- 발주서 이동 핸들러 (단독 페이지 — 발주앱 메인으로 redirect) -->
<script>
  function goToOrder(orderNum) {
    if (!orderNum) return;
    location.href = './index.html#order=' + encodeURIComponent(orderNum);
  }
</script>

</body>
</html>
